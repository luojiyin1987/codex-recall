name: Go compatibility probe

on:
  pull_request:
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - .github/workflows/go-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.target }} / Go ${{ matrix.directive }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            toolchain: 1.22.x
            directive: "1.22"
            required: false
          - target: linux-x64
            runner: ubuntu-latest
            toolchain: 1.23.x
            directive: "1.23"
            required: false
          - target: linux-x64
            runner: ubuntu-latest
            toolchain: 1.24.x
            directive: "1.24"
            required: true
          - target: macos-x64
            runner: macos-15-intel
            toolchain: 1.22.x
            directive: "1.22"
            required: false
          - target: macos-x64
            runner: macos-15-intel
            toolchain: 1.23.x
            directive: "1.23"
            required: false
          - target: macos-x64
            runner: macos-15-intel
            toolchain: 1.24.x
            directive: "1.24"
            required: true
          - target: macos-arm64
            runner: macos-latest
            toolchain: 1.22.x
            directive: "1.22"
            required: false
          - target: macos-arm64
            runner: macos-latest
            toolchain: 1.23.x
            directive: "1.23"
            required: false
          - target: macos-arm64
            runner: macos-latest
            toolchain: 1.24.x
            directive: "1.24"
            required: true

    runs-on: ${{ matrix.runner }}
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go ${{ matrix.toolchain }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.toolchain }}
          cache: false

      - name: Lower go directive in probe workspace
        shell: bash
        env:
          GO_DIRECTIVE: ${{ matrix.directive }}
        run: |
          sed -i.bak -E "s/^go [0-9.]+$/go ${GO_DIRECTIVE}/" go.mod
          rm go.mod.bak
          head -n 4 go.mod
          go version
          go env GOOS GOARCH GOTOOLCHAIN

      - name: Test
        id: test
        continue-on-error: true
        shell: bash
        run: go test -mod=mod ./...

      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p dist
          go build -mod=mod -trimpath -o dist/cxq ./cmd/cxq

      - name: SQLite smoke test
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          home="${RUNNER_TEMP}/codex-recall-compat"
          rollout="${home}/sessions/2026/09/04/rollout-2026-09-04T09-00-00-compat-session.jsonl"
          mkdir -p "$(dirname "${rollout}")"
          cat > "${rollout}" <<'JSON'
          {"timestamp":"2026-09-04T09:00:00Z","type":"session_meta","payload":{"id":"compat-session","timestamp":"2026-09-04T09:00:00Z","cwd":"/tmp/compat","source":"cli"}}
          {"timestamp":"2026-09-04T09:00:01Z","type":"event_msg","payload":{"type":"user_message","message":"compatibility sqlite needle"}}
          JSON

          ./dist/cxq index --home "${home}"
          ./dist/cxq search --index --home "${home}" "compatibility sqlite needle" | tee "${RUNNER_TEMP}/search.txt"
          grep -q "compat-session" "${RUNNER_TEMP}/search.txt"

      - name: Inspect Mach-O LC_UUID
        id: uuid
        if: runner.os == 'macOS' && steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          if otool -l dist/cxq | grep -q LC_UUID; then
            echo "LC_UUID present"
          else
            echo "LC_UUID absent"
            exit 1
          fi

      - name: Summarize compatibility evidence
        if: always()
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GO_DIRECTIVE: ${{ matrix.directive }}
          REQUIRED: ${{ matrix.required }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          UUID_OUTCOME: ${{ steps.uuid.outcome }}
        run: |
          {
            echo "### ${TARGET} / Go ${GO_DIRECTIVE}"
            echo
            echo "| Check | Outcome |"
            echo "| --- | --- |"
            echo "| go test ./... | ${TEST_OUTCOME} |"
            echo "| go build ./cmd/cxq | ${BUILD_OUTCOME} |"
            echo "| SQLite index/search smoke | ${SMOKE_OUTCOME} |"
            if [[ "${TARGET}" == macos-* ]]; then
              echo "| Mach-O LC_UUID | ${UUID_OUTCOME} |"
            fi
            echo
            echo "Current baseline required: ${REQUIRED}"
          } >> "${GITHUB_STEP_SUMMARY}"

          compatible=true
          [[ "${TEST_OUTCOME}" == "success" ]] || compatible=false
          [[ "${BUILD_OUTCOME}" == "success" ]] || compatible=false
          [[ "${SMOKE_OUTCOME}" == "success" ]] || compatible=false
          # LC_UUID is diagnostic evidence, not an independent compatibility
          # requirement. Actual test/build/smoke execution determines whether
          # the toolchain is usable on the target OS.
          if [[ "${REQUIRED}" == "true" && "${compatible}" != "true" ]]; then
            echo "Required Go baseline failed compatibility checks."
            exit 1
          fi

          if [[ "${REQUIRED}" != "true" && "${compatible}" != "true" ]]; then
            echo "Probe toolchain is not fully compatible on this target; recorded as evidence."
          fi
