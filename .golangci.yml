version: "2"
run:
  timeout: 5m

linters:
  default: none
  enable:
    - errorlint
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - durationcheck
    - makezero
    - nilerr
    - prealloc
    - unconvert
    - unparam
    - wastedassign
  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - unparam
          - prealloc
